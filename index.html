<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memory Verses</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Literata:opsz,wght@7..72,600&display=swap">
<style>
:root{--bg:#F5F7F9;--surface:#FFFFFF;--ink:#18212B;--muted:#5B6773;--line:#DDE3E9;--vd:#0E4752;
  --f-display:"Literata",Georgia,serif;--f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#11161B;--surface:#1A2128;--ink:#E8EDF2;--muted:#9AA6B2;--line:#2C3640;--vd:#2A7F8A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:600;font-size:30px;margin:0 0 8px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--vd);border-radius:14px;padding:18px 20px}
a.card:hover,a.card:focus-visible{border-color:var(--vd)}
a.card b{display:block;font-family:var(--f-display);font-size:21px;font-weight:600}
a.card span{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
  <div><div class="eyebrow">Sabbath School</div><h1>Memory Verses</h1></div>
  <a class="card" href="quarter-4-primary/"><b>Quarter 4 Primary</b><span>Memory verses 1–13 (NKJV)</span></a>
  <a class="card" href="quarter-4-junior/"><b>Quarter 4 Junior/Teen</b><span>Lessons 40–52 (NKJV)</span></a>
</main>
</body>
</html>
